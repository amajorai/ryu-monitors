[package]
name = "ryu-monitors"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Ryu website and provider-usage monitor sidecar. Checks pages or normalized provider usage on a schedule and fans out alerts across desktop, registered mobile devices, webhooks, Telegram, and email. Core supplies provider-credential reads, scheduler ticks, and notification delivery through authenticated host callbacks."
repository = "https://github.com/amajorai/ryu"

# The out-of-process sidecar binary. Core spawns it (`kind: local`, sibling on
# PATH / `RYU_MONITORS_BIN`), health-checks it, and proxies `/api/monitors/*` to it on
# loopback — exactly like `ryu-quests` / `ryu-mail`. The same crate still compiles
# INTO Core as a lib path-dependency (in-process default); this bin is just the
# process shell around the crate's `routes()` + `MonitorEngine`.
[[bin]]
name = "ryu-monitors"
path = "src/main.rs"

# Versions are matched to apps/core/Cargo.toml so the in-process merge into Core's
# axum router has no version skew. This crate has ZERO dependency on apps/core.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
tracing = "0.1"
async-trait = "0.1"
ryu-notify = { path = "../crates/core/notify", version = "0.5.0" }
# At-rest sealing of notify-target credentials (`encp:v1:` under the
# `@ryu/monitors` plugin subkey Core delivers at spawn). No keychain backend.
ryu-crypto = { path = "../crates/core/crypto", version = "0.5.0", default-features = false }
base64 = "0.22"
ryu-egress = { path = "../crates/core/egress", version = "0.5.0" }
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.5.0" }
# Raises this app's declared `hook_events` (manifest `contributes.hook_events`) so
# other plugins/workflows can react to a watch tripping. Emit-only and best-effort:
# it no-ops when the process is not Core-hosted, so the standalone bin and this
# crate's own tests are unaffected.
ryu-app-events = { path = "../crates/core/app-events", version = "0.5.0" }
humantime = "2"
regex = "1"
sha2 = "0.10"
url = "2"
# Sidecar-binary-only deps (data-dir resolution + logging), mirroring `ryu-quests` /
# `ryu-mail`. Core already pulls all of these, so there is no new dependency in the
# in-process build.
dirs = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the served router (bearer gate + `/health`)
# in-process in `src/gate_tests.rs`. Test-only; already locked at 0.4.13.
tower = { version = "0.4", features = ["util"] }
